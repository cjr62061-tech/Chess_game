<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ball Tap Game - Tap & Score!</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:sans-serif;text-align:center;overflow:hidden}
h1{margin:10px;color:#38bdf8}
#info{display:flex;justify-content:space-around;max-width:500px;margin:10px auto;font-size:20px;font-weight:bold}
#gameArea{position:relative;width:100vw;height:75vh;background:radial-gradient(#1e293b,#0f172a);overflow:hidden;border-top:2px solid #334155;border-bottom:2px solid #334155}
.ball{position:absolute;width:60px;height:60px;background:radial-gradient(circle at 30% 30%, #fbbf24, #ef4444);border-radius:50%;cursor:pointer;box-shadow:0 0 20px #fbbf24;transition:transform 0.1s;user-select:none;display:flex;align-items:center;justify-content:center;font-size:30px}
.ball:active{transform:scale(0.8)}
button{padding:12px 25px;background:#22c55e;color:white;border:0;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;margin:10px}
#over{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10}
</style>
</head>
<body>
<h1>🎯 Ball Tap Challenge</h1>
<div id="info">
<div>Score: <span id="score">0</span></div>
<div>Time: <span id="time">30</span>s</div>
<div>High: <span id="high">0</span></div>
</div>
<div id="gameArea"></div>
<button onclick="startGame()">▶️ Start Game</button>

<div id="over">
<h1 style="font-size:40px">Game Over!</h1>
<h2>Your Score: <span id="finalScore">0</span></h2>
<button onclick="startGame()">🔄 Play Again</button>
</div>

<script>
let score=0,time=30,gameInterval,ballInterval,timerInterval;
let high=localStorage.getItem('ballHigh')||0;
document.getElementById('high').innerText=high;
const area=document.getElementById('gameArea');

function randomBall(){
area.innerHTML='';
let b=document.createElement('div');
b.className='ball';
b.innerHTML='⚽';
let x=Math.random()*(area.clientWidth-70);
let y=Math.random()*(area.clientHeight-70);
b.style.left=x+'px';
b.style.top=y+'px';
b.onclick=()=>{
score++;
if(score%5==0) b.style.transform='scale(1.3)';
document.getElementById('score').innerText=score;
b.remove();
randomBall();
navigator.vibrate&&navigator.vibrate(30);
};
area.appendChild(b);
}

function startGame(){
score=0;time=30;
document.getElementById('score').innerText=0;
document.getElementById('time').innerText=30;
document.getElementById('over').style.display='none';
randomBall();
clearInterval(timerInterval);
clearInterval(ballInterval);
timerInterval=setInterval(()=>{
time--;
document.getElementById('time').innerText=time;
if(time<=0) endGame();
},1000);
ballInterval=setInterval(()=>{
if(document.querySelector('.ball')) randomBall();
},1200);
}

function endGame(){
clearInterval(timerInterval);
clearInterval(ballInterval);
area.innerHTML='';
document.getElementById('finalScore').innerText=score;
document.getElementById('over').style.display='flex';
if(score>high){high=score;localStorage.setItem('ballHigh',high);document.getElementById('high').innerText=high;}
}
</script>
</body>
</html>
