<script>
const firebaseConfig={
  apiKey:"AIzaSyC_xJgAyK4PEZEiNyorGEZshz58Gnu29Go",
  authDomain:"myapp52-d02d6.firebaseapp.com",

firebase.initializeApp(firebaseConfig); const auth=firebase.auth(); const db=firebase.firestore(); auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
let currentUser=null,isPro=false;
function updateUI(u,d){ isPro=d&&d.isPro; document.getElementById('blueTick').style.display=isPro?'inline-flex':'none'; document.getElementById('pTick').style.display=isPro?'inline-flex':'none'; document.getElementById('proBadge').style.display=isPro?'inline-block':'none'; document.getElementById('proStatus').innerText=isPro?'PRO ✓':'Free'; document.getElementById('pStatus').innerText=isPro?'Blue Tick Verified • Lifetime':'Free'; document.getElementById('coins').innerText=d?.score||0; document.getElementById('userEmail').innerText=u.email||'Guest'; }
function showGames(u){ currentUser=u; authBox.style.display='none'; gamesWrap.style.display='block'; db.collection('users').doc(u.uid).onSnapshot(doc=>{ if(doc.exists) updateUI(u,doc.data()); }); if(!u.isAnonymous) db.collection('users').doc(u.uid).set({email:u.email,lastLogin:new Date()},{merge:true}); loadWorldChat(); }
auth.onAuthStateChanged(u=>{ if(u) showGames(u); });
function login(){ auth.signInWithEmailAndPassword(email.value,pass.value).then(r=>showGames(r.user)).catch(e=>msg.innerText=e.message); }
function signup(){ auth.createUserWithEmailAndPassword(email.value,pass.value).then(r=>{ db.collection('users').doc(r.user.uid).set({email:email.value,isPro:false,blueTick:false,score:0,createdAt:new Date()}); showGames(r.user); }).catch(e=>msg.innerText=e.message); }
function guestLogin(){ auth.signInAnonymously().then(r=>showGames(r.user)); }
function showTab(id,el){ document.querySelectorAll('.game').forEach(g=>g.classList.remove('active')); if(document.getElementById(id)) document.getElementById(id).classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); if(el) el.classList.add('active'); }
function verifyPro(){ const txn=document.getElementById('txnId').value.trim(); if(txn.length<6){ proMsg.innerText='Valid ID daalo'; return; } if(!currentUser){ proMsg.innerText='Login karo'; return; } db.collection('users').doc(currentUser.uid).set({isPro:true,blueTick:true,proTxn:txn,proSince:new Date(),lifetime:true},{merge:true}).then(()=>{ proMsg.innerText='✅ BLUE TICK LIFETIME ACTIVATED!'; localStorage.setItem('cjr_pro','true'); }); }
function doSearch(v){ if(!v) return; v=v.toLowerCase(); if(v.includes('chess')) showTab('chess'); if(v.includes('snake')) showTab('snake'); if(v.includes('exam')||v.includes('gk')) showTab('exam'); if(v.includes('tic')) showTab('ttt'); }
var game=new Chess(),board=null; function onDrop(s,t){ var m=game.move({from:s,to:t,promotion:'q'}); if(m===null) return 'snapback'; document.getElementById('chessStatus').innerText=(game.turn()=='w'?'White':'Black')+' to move'; } try{ board=Chessboard('board',{draggable:true,position:'start',onDrop:onDrop,pieceTheme:'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'});}catch(e){} function resetChess(){ game.reset(); board.start(); } function undoChess(){ if(!isPro){ alert('PRO only'); showTab('pro'); return;} game.undo(); board.position(game.fen()); }
let ttt=['','','','','','','','',''],tttTurn='X'; function renderTTT(){ const b=document.getElementById('tttBoard'); if(!b) return; b.innerHTML=''; ttt.forEach((v,i)=>{ let d=document.createElement('div'); d.className='bg-slate-800 h-16 flex items-center justify-center font-bold rounded'; d.innerText=v; d.onclick=()=>{ if(ttt[i]||checkWin()) return; ttt[i]=tttTurn; tttTurn=tttTurn=='X'?'O':'X'; document.getElementById('tttStatus').innerText='Turn '+tttTurn; renderTTT(); if(checkWin()) document.getElementById('tttStatus').innerText='Winner '+checkWin(); }; b.appendChild(d); }); } function checkWin(){ const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for(let p of w){ if(ttt[p[0]]&&ttt[p[0]]==ttt[p[1]]&&ttt[p[0]]==ttt[p[2]]) return ttt[p[0]]; } return null; } function resetTTT(){ ttt=['','','','','','','','','']; tttTurn='X'; renderTTT(); } renderTTT();
let snake,food,dir='right',sInt,sScore=0; function startSnake(){ snake=[{x:5,y:5}]; food={x:10,y:10}; dir='right'; sScore=0; document.getElementById('snakeScore').innerText=0; clearInterval(sInt); sInt=setInterval(()=>{ const c=document.getElementById('snakeCanvas'); if(!c) return; const ctx=c.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,300,300); let h={...snake[0]}; if(dir=='right')h.x++; if(dir=='left')h.x--; if(dir=='up')h.y--; if(dir=='down')h.y++; if(h.x<0||h.x>=15||h.y<0||h.y>=15||snake.some(s=>s.x==h.x&&s.y==h.y)){ clearInterval(sInt); alert('Over Score '+sScore); return; } snake.unshift(h); if(h.x==food.x&&h.y==food.y){ sScore+=10; document.getElementById('snakeScore').innerText=sScore; food={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)}; } else snake.pop(); ctx.fillStyle='lime'; snake.forEach(s=>ctx.fillRect(s.x*20,s.y*20,18,18)); ctx.fillStyle='red'; ctx.fillRect(food.x*20,food.y*20,18,18); },120); }
function rollDice(){ document.getElementById('dice').innerText=Math.floor(Math.random()*6)+1; }
let qs={Maths:[{q:"12x8=?",o:["96","86","76","106"],a:0},{q:"15*15=?",o:["225","215","235","205"],a:0},{q:"25+37=?",o:["62","72","52","82"],a:0}],Science:[{q:"H2O?",o:["Water","Fire","Air","Soil"],a:0},{q:"Sun is?",o:["Star","Planet","Moon","Comet"],a:0}],"MP GK":[{q:"MP Capital?",o:["Bhopal","Indore","Gwalior","Jabalpur"],a:0},{q:"MP me kitne jile?",o:["52","55","50","53"],a:1}],Computer:[{q:"CPU?",o:["Central Processing Unit","Computer Unit","Central Power Unit","None"],a:0}],"Chess Tactics":[{q:"Best first move?",o:["e4","a4","h4","f3"],a:0}]}; let cur=0,score=0,currentSet=[]; function startExam(){ currentSet=qs[document.getElementById('subject').value]||qs.Maths; cur=0;score=0; document.getElementById('quizBox').style.display='block'; showQ(); } function showQ(){ let q=currentSet[cur]; document.getElementById('question').innerText=`Q${cur+1}/${currentSet.length}: ${q.q}`; let o=document.getElementById('options'); o.innerHTML=''; q.o.forEach((op,i)=>{ o.innerHTML+=`<label class="block bg-slate-900 p-2 rounded mt-1 text-xs"><input type="radio" name="opt" value="${i}"> ${op}</label>`; }); } function nextQ(){ let sel=document.querySelector('input[name="opt"]:checked'); if(sel&&parseInt(sel.value)==currentSet[cur].a) score++; cur++; if(cur<currentSet.length) showQ(); else{ document.getElementById('quizBox').style.display='none'; document.getElementById('result').innerText=`Result ${score}/${currentSet.length}`; } }
let bScore=0,bTime=30,bt,bb; function startBall(){ bScore=0;bTime=isPro?60:30; document.getElementById('bScore').innerText=0; clearInterval(bt); clearInterval(bb); spawn(); bt=setInterval(()=>{ bTime--; document.getElementById('bTime').innerText=bTime; if(bTime<=0){ clearInterval(bt); clearInterval(bb); alert('Score '+bScore); }},1000); bb=setInterval(spawn,800); } function spawn(){ let a=document.getElementById('area'); if(!a) return; let d=document.createElement('div'); d.style.cssText='position:absolute;width:35px;height:35px;background:gold;border-radius:50%;left:'+Math.random()*(a.clientWidth-35)+'px;top:'+Math.random()*(a.clientHeight-35)+'px'; d.onclick=()=>{ bScore++; document.getElementById('bScore').innerText=bScore; d.remove(); }; a.appendChild(d); setTimeout(()=>d.remove(),2000); }
function loadWorldChat(){ db.collection('world_chat').orderBy('time','desc').limit(30).onSnapshot(snap=>{ const chat=document.getElementById('globalChat'); if(!chat) return; chat.innerHTML=''; snap.forEach(doc=>{ let data=doc.data(); let d=document.createElement('div'); d.className='py-1 border-b border-slate-800'; d.innerHTML=`<b class="${data.isPro?'text-yellow-400':''}">${data.user||'Anon'} ${data.isPro?'<span class="tick">✓</span>':''}:</b> ${data.text}`; chat.appendChild(d); }); }); }
function sendWorld(){ const inp=document.getElementById('worldIn'); if(!inp.value.trim()) return; db.collection('world_chat').add({text:inp.value,user:currentUser.email||'Guest',isPro:isPro,time:new Date()}); inp.value=''; }
function askAI(){ const q=document.getElementById('aiIn').value.trim(); if(!q) return; const chat=document.getElementById('aiChat'); let u=document.createElement('div'); u.innerHTML=`<div class="bg-slate-800 p-2 rounded mt-2">You: ${q}</div>`; chat.appendChild(u); let a=document.createElement('div'); a.className='bg-cyan-950 p-2 rounded mt-2'; let ans=''; try{ if(/[0-9+\-*/x%]+/.test(q)) ans='Answer: '+eval(q.replace(/x/g,'*').replace(/[^0-9+\-*/().% ]/g,'')); else if(q.toLowerCase().includes('capital')) ans='MP Capital Bhopal'; else ans=isPro?`AI Pro: ${q} ka detailed solution...`: `AI: ${q} - Full solution PRO me`; }catch{ ans='Try simple maths like 12*15'; } a.innerHTML=`AI Bhai: ${ans}`; chat.appendChild(a); document.getElementById('aiIn').value=''; chat.scrollTop=chat.scrollHeight; }
